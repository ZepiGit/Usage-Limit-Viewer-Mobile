org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# versionCode for every build that is not a release; a release passes its own value through
# ANDROID_VERSION_CODE. Bumped by hand, never lowered: it has to stay above the code of the last
# published release, and a commit count cannot promise that because a rewritten history restarts
# it. Release 0.5.0 shipped 884 and release 0.5.1 takes 885; the release after it takes 886.
app.versionCode=885
