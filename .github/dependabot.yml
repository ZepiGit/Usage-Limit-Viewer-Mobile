# Weekly version checks for libraries and GitHub Actions.
#
# AGP, Gradle, Kotlin, KSP and the Compose compiler move together in coordinated manual updates.
# Kotlin 2.4.21's fully supported ranges end at AGP 9.3.1 and Gradle 9.7.0; Dependabot does not
# resolve these compatibility constraints. Keep the Kotlin Android plugin excluded even though AGP's
# built-in Kotlin replaces it. See https://kotlinlang.org/docs/gradle-configure-project.html.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "com.android.application"
      - dependency-name: "com.android.tools.build:gradle"
      - dependency-name: "gradle-wrapper"
      - dependency-name: "org.jetbrains.kotlin.android"
      - dependency-name: "org.jetbrains.kotlin.plugin.serialization"
      - dependency-name: "org.jetbrains.kotlin.plugin.compose"
      - dependency-name: "org.jetbrains.kotlin:*"
      - dependency-name: "com.google.devtools.ksp"
      # API 37 and the coordinated Kotlin/AGP upgrade remove the first-wave library bounds.
      # Library and security updates may advance normally; the coupled toolchain stays manual.
    # Keep coupled artifacts together without making unrelated AndroidX families one upgrade.
    groups:
      compose:
        patterns:
          - "androidx.compose*"
      room:
        patterns:
          - "androidx.room:*"
      workmanager:
        patterns:
          - "androidx.work:*"
      lifecycle:
        patterns:
          - "androidx.lifecycle:*"
      glance:
        patterns:
          - "androidx.glance:*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Review action runtime and artifact changes together, then run the maintainer smoke gate.
    groups:
      github-actions:
        patterns:
          - "*"
