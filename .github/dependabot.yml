# Weekly version checks for libraries and GitHub Actions.
#
# The build toolchain is left out on purpose: the Android Gradle Plugin, the Gradle wrapper, Kotlin,
# KSP and the Compose compiler only work in certain combinations (AGP 9 needs Gradle 9.1 and a
# different Kotlin plugin setup; Kotlin 2.3 needs the R8 that ships with AGP 8.13.2), and Dependabot
# does not resolve those constraints. They move together, by hand, in one coordinated change.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "com.android.application"
      - dependency-name: "com.android.tools.build:gradle"
      - dependency-name: "gradle-wrapper"
      - dependency-name: "org.jetbrains.kotlin.android"
      - dependency-name: "org.jetbrains.kotlin.plugin.serialization"
      - dependency-name: "org.jetbrains.kotlin.plugin.compose"
      - dependency-name: "org.jetbrains.kotlin:*"
      - dependency-name: "com.google.devtools.ksp"
      # Keep patches on the current AndroidX lines while the toolchain is frozen. The latest
      # group requires AGP 9.1 and compileSdk 37; intermediate minor lines are not validated.
      # Revisit these bounds in the coordinated toolchain upgrade, not in weekly update PRs.
      - dependency-name: "androidx.core:*"
        versions: ["[1.16.0,)"]
      - dependency-name: "androidx.compose:compose-bom"
        versions: ["[2025.01.00,)"]
      - dependency-name: "androidx.navigation:*"
        versions: ["[2.9.0,)"]
      - dependency-name: "androidx.room:*"
        versions: ["[2.7.0,)"]
      - dependency-name: "androidx.work:*"
        versions: ["[2.11.0,)"]
      - dependency-name: "androidx.browser:*"
        versions: ["[1.9.0,)"]
      - dependency-name: "androidx.datastore:*"
        versions: ["[1.2.0,)"]
      # Coroutines 1.10 and serialization 1.8 moved to Kotlin 2.1; retain the Kotlin 2.0 lines.
      # The proposed 1.11 / 1.13 fail KSP on Kotlin metadata 2.2 / 2.4 respectively.
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines-*"
        versions: ["[1.10.0,)"]
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-serialization-*"
        versions: ["[1.8.0,)"]
      # OkHttp 5.5.1 requires compileSdk 37; review the 5.x artifacts and MockWebServer API
      # in a separate migration after the toolchain moves. Keep 4.x maintenance updates.
      - dependency-name: "com.squareup.okhttp3:*"
        versions: ["[5.0.0,)"]
    # Keep coupled artifacts together without making unrelated AndroidX families one upgrade.
    groups:
      compose:
        patterns:
          - "androidx.compose*"
      room:
        patterns:
          - "androidx.room:*"
      workmanager:
        patterns:
          - "androidx.work:*"
      lifecycle:
        patterns:
          - "androidx.lifecycle:*"
      glance:
        patterns:
          - "androidx.glance:*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
