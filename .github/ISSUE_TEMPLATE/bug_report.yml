name: Bug report
description: Report a problem with Usage Limits Mobile.
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Do not include API keys, OAuth tokens, or personal account data in text, logs, or screenshots.
        For vulnerabilities, use the [security policy and private reporting link](https://github.com/ZepiGit/Usage-Limit-Viewer-Mobile/security/policy).
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Enter the app version, or the commit if you built from source.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: Android 15 or iOS 18
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the steps, including the affected provider or widget if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe what happened. Redact any logs or screenshots before attaching them.
    validations:
      required: true
