name: Release

# CI builds and signs artifacts. The release owner publishes the checked artifacts
# through their existing authenticated GitHub account; this workflow never publishes.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Stable version name, e.g. 0.2.1'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate the version and pin the source commit
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.versionName || github.ref_name }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Release version must be a stable major.minor.patch version.' >&2
            exit 1
          fi
          version_code="$(git rev-list --count HEAD)"
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo 'Release version code is outside the Android supported range.' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  android:
    name: Android release
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_VERSION_NAME: ${{ needs.metadata.outputs.version }}
      ANDROID_VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Test and lint before signing
        run: ./gradlew --no-daemon --no-configuration-cache :app:testDebugUnitTest :app:lintDebug

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-android-checks
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      # No Gradle caching action: signing settings must not enter a shared cache.
      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo 'ANDROID_KEYSTORE_BASE64 is not set; a release cannot be signed.' >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"

      - name: Build the signed bundle and APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --no-configuration-cache :app:bundleRelease :app:assembleRelease

      - name: Forget the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Stage the build outputs
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab dist/
          cp app/build/outputs/apk/release/app-release.apk dist/
          cp app/build/outputs/mapping/release/mapping.txt dist/
          sha256sum dist/app-release.apk > dist/app-release.apk.sha256

      - name: Upload the build outputs
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist
          if-no-files-found: error

  android-runtime:
    name: Verify the release APK on API 36
    needs: [metadata, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: runtime/apk
      - name: Download the published upgrade baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p runtime/previous runtime/evidence
          gh release download v0.2.0 --repo "$GITHUB_REPOSITORY" \
            --pattern 'UsageLimits-0.2.0.apk' --dir runtime/previous
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Record release APK identity and signatures
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$RELEASE_COMMIT" ] || [ "$GITHUB_SHA" != "$RELEASE_COMMIT" ]; then
            echo '::error::Release metadata, runtime checkout and workflow commit must match.' >&2
            exit 1
          fi
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$build_tools/aapt" dump badging runtime/apk/app-release.apk > runtime/evidence/apk-metadata.txt
          "$build_tools/aapt" dump badging runtime/previous/UsageLimits-0.2.0.apk > runtime/evidence/apk-previous-metadata.txt
          "$build_tools/apksigner" verify --verbose --print-certs runtime/apk/app-release.apk > runtime/evidence/apk-signature.txt
          "$build_tools/apksigner" verify --verbose --print-certs runtime/previous/UsageLimits-0.2.0.apk > runtime/evidence/apk-previous-signature.txt
          cp runtime/apk/app-release.apk.sha256 runtime/evidence/apk-sha256.txt
      - name: Check the AOSP API 36 image is available
        run: |
          set -euo pipefail
          sdkmanager --list > runtime/evidence/sdk-packages.txt
          if ! grep -Eq '^[[:space:]]*system-images;android-36;default;x86_64[[:space:]]*\|' runtime/evidence/sdk-packages.txt; then
            echo '::error::The SDK repository does not list the required AOSP API 36 x86_64 image.' >&2
            exit 1
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Upgrade and navigate the release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_7_pro
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 tools/android_runtime_smoke.py --previous-apk runtime/previous/UsageLimits-0.2.0.apk --apk runtime/apk/app-release.apk --apk-sha256-file runtime/apk/app-release.apk.sha256 --evidence runtime/evidence
      - name: Upload release runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-android-runtime-evidence-${{ needs.metadata.outputs.version }}
          path: runtime/evidence
          if-no-files-found: warn

  ios:
    name: iOS archive
    needs: metadata
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.commit }}
      - name: Test the shared package
        working-directory: ios/UsageLimitsKit
        run: swift test --parallel
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the project
        working-directory: ios/UsageLimits
        run: xcodegen generate

      # This archive has no distribution certificate or provisioning profile.
      # It verifies the release configuration but is not installable as-is.
      - name: Archive
        working-directory: ios/UsageLimits
        run: |
          set -euo pipefail
          xcodebuild archive \
            -scheme UsageLimits \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/UsageLimits.xcarchive" \
            MARKETING_VERSION="$RELEASE_VERSION" \
            CURRENT_PROJECT_VERSION="$RELEASE_VERSION_CODE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Zip the archive for the release
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          printf '%s\n' \
            'Unsigned iOS release archive of Usage Limits (Release configuration).' \
            '' \
            'This archive is not installable on a device as-is: it carries no distribution' \
            'certificate or provisioning profile. Open it in Xcode and assign a team' \
            'before distribution.' \
            > RELEASE-README.txt
          zip -q -r UsageLimits-ios-unsigned.xcarchive.zip UsageLimits.xcarchive RELEASE-README.txt

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive
          path: ${{ runner.temp }}/UsageLimits-ios-unsigned.xcarchive.zip
          if-no-files-found: error

  package:
    name: Package artifacts for the release owner
    needs: [metadata, android, android-runtime, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: ios-archive
          path: artifacts
      - name: Package the release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          mv artifacts/app-release.apk "dist/UsageLimits-$RELEASE_VERSION.apk"
          mv artifacts/app-release.aab "dist/UsageLimits-$RELEASE_VERSION.aab"
          mv artifacts/mapping.txt "dist/UsageLimits-$RELEASE_VERSION-mapping.txt"
          mv artifacts/UsageLimits-ios-unsigned.xcarchive.zip \
            "dist/UsageLimits-$RELEASE_VERSION-ios-unsigned.xcarchive.zip"
          printf 'version=%s\nversionCode=%s\ncommit=%s\n' \
            "$RELEASE_VERSION" "$RELEASE_VERSION_CODE" "$RELEASE_COMMIT" > dist/RELEASE-METADATA.txt
          (cd dist && sha256sum ./* > SHA256SUMS)
          printf 'Artifacts for v%s at `%s` are ready. Follow docs/release.md to verify and publish using the release owner account.\n' \
            "$RELEASE_VERSION" "$RELEASE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the versioned release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ needs.metadata.outputs.version }}
          path: dist
          if-no-files-found: error
