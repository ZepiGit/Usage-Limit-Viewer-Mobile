name: Android

# The Android app had no CI at all, which on this project is the wrong way round: it is the
# primary deliverable, its parsers are where every real defect has been found, and it is the
# half that can actually be built on a free Linux runner. The iOS workflow existed first only
# because the shared Swift package happens to compile on Linux too.
#
# `test` checks logic, `assemble` packages the APK, and `runtime` installs that same signed,
# minified artifact over the previous release and navigates it on a real Android emulator.

on:
  push:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'tools/android_runtime_smoke.py'
      - 'tools/run_android_runtime.sh'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'tools/android_runtime_smoke.py'
      - 'tools/run_android_runtime.sh'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    # Bounded so a hung step cannot run to the six-hour default. A UI test that waits
    # on a simulator alert nobody can dismiss looks exactly like a slow one, and on a
    # macOS runner that mistake is billed at ten times the rate.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Robolectric Android 16 requires JDK 21; app bytecode still targets Java 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      # Uploaded on failure only, and always: a red unit test is unreadable from the console
      # output alone, and the HTML report is the thing that says which assertion and with what
      # values.
      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-evidence
          path: |
            app/build/test-results/testDebugUnitTest
            app/build/reports/lint-results-debug.*
            app/build/reports/widget-renderings
            app/schemas
          if-no-files-found: error

  assemble:
    name: Debug APK
    runs-on: ubuntu-latest
    # Bounded so a hung step cannot run to the six-hour default. A UI test that waits
    # on a simulator alert nobody can dismiss looks exactly like a slow one, and on a
    # macOS runner that mistake is billed at ten times the rate.
    timeout-minutes: 30
    steps:
      # The full history, because the version code is the commit count: it has to rise from
      # one build to the next or the installer treats the newer APK as a re-install rather
      # than an update. A shallow clone would count 1 every time.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Both APKs are signed with the debug key checked in at app/debug.keystore — the same
      # key on every run, so a phone that has the previous build installed updates in place
      # and keeps its accounts, credentials and widgets. Before this, each runner minted its
      # own debug key and every download meant uninstalling first. The release key is used
      # instead when the repository's signing secrets are present.
      - name: Decode the release signing key when configured
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            chmod 600 "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Assemble
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_VERSION_CODE="$(git rev-list --count HEAD)"
          ./gradlew --no-daemon --no-configuration-cache assembleDebug assembleRelease
          mkdir -p app/build/reports
          ./gradlew --no-daemon --no-configuration-cache :app:dependencies --configuration releaseRuntimeClasspath --console=plain > app/build/reports/apk-runtime-dependencies.txt

      - name: Verify APK identity and signing continuity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          apk=app/build/outputs/apk/release/app-release.apk
          mkdir -p app/build/reports
          "$build_tools/aapt" dump badging "$apk" > app/build/reports/apk-metadata.txt
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" > app/build/reports/apk-signature.txt
          sha256sum "$apk" > app/build/reports/apk-sha256.txt
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            mkdir -p "$RUNNER_TEMP/previous-release"
            gh release download v0.2.0 --repo "$GITHUB_REPOSITORY" \
              --pattern 'UsageLimits-0.2.0.apk' --dir "$RUNNER_TEMP/previous-release"
            "$build_tools/aapt" dump badging \
              "$RUNNER_TEMP/previous-release/UsageLimits-0.2.0.apk" > app/build/reports/apk-previous-metadata.txt
            "$build_tools/apksigner" verify --print-certs \
              "$RUNNER_TEMP/previous-release/UsageLimits-0.2.0.apk" > "$RUNNER_TEMP/previous-signature.txt"
            # apksigner uses either "Signer #1" or a scheme prefix such as "V2 Signer:".
            # A certificate repeated across schemes is one signer; distinct digests are ambiguous.
            certificate_pattern='s/^(Signer #[0-9]+|V[0-9]+(\.[0-9]+)* Signer:) certificate SHA-256 digest: (.*)$/\3/p'
            previous=$(sed -nE "$certificate_pattern" "$RUNNER_TEMP/previous-signature.txt" | tr '[:upper:]' '[:lower:]' | sort -u)
            current=$(sed -nE "$certificate_pattern" app/build/reports/apk-signature.txt | tr '[:upper:]' '[:lower:]' | sort -u)
            if [[ ! "$previous" =~ ^[0-9a-f]{64}$ || ! "$current" =~ ^[0-9a-f]{64}$ ]]; then
              echo '::error::Expected exactly one nonempty SHA-256 signing certificate in each APK report.' >&2
              exit 1
            fi
            if [ "$previous" != "$current" ]; then
              echo '::error::Release signing certificate differs from v0.2.0.' >&2
              exit 1
            fi
            previous_package=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" app/build/reports/apk-previous-metadata.txt)
            current_package=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" app/build/reports/apk-metadata.txt)
            previous_code=$(sed -n "s/^package: .* versionCode='\([^']*\)'.*/\1/p" app/build/reports/apk-previous-metadata.txt)
            current_code=$(sed -n "s/^package: .* versionCode='\([^']*\)'.*/\1/p" app/build/reports/apk-metadata.txt)
            previous_version=$(sed -n "s/^package: .* versionName='\([^']*\)'.*/\1/p" app/build/reports/apk-previous-metadata.txt)
            current_version=$(sed -n "s/^package: .* versionName='\([^']*\)'.*/\1/p" app/build/reports/apk-metadata.txt)
            if [[ ! "$previous_package" =~ ^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$ || "$previous_package" != "$current_package" ]]; then
              echo '::error::Expected the same valid package name in both APK reports.' >&2
              exit 1
            fi
            if [[ ! "$previous_code" =~ ^[1-9][0-9]{0,9}$ || ! "$current_code" =~ ^[1-9][0-9]{0,9}$ ]]; then
              echo '::error::Expected a positive numeric versionCode in both APK reports.' >&2
              exit 1
            fi
            if (( previous_code > 2100000000 || current_code > 2100000000 || current_code <= previous_code )); then
              echo '::error::APK versionCodes must be in range and the new versionCode must increase.' >&2
              exit 1
            fi
            if [[ -z "$previous_version" || -z "$current_version" ]]; then
              echo '::error::Expected a versionName in both APK reports.' >&2
              exit 1
            fi
            {
              printf 'Previous APK: package=%s versionName=%s versionCode=%s\n' "$previous_package" "$previous_version" "$previous_code"
              printf 'Current APK: package=%s versionName=%s versionCode=%s\n' "$current_package" "$current_version" "$current_code"
              echo 'Package matches, versionCode increased, and signing certificate matches v0.2.0.'
            } > app/build/reports/apk-upgrade.txt
          else
            echo 'Verification build only; release signing is unavailable.' > app/build/reports/apk-upgrade.txt
          fi

      - name: Upload APK verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-verification
          path: app/build/reports/apk-*.txt
          if-no-files-found: ignore

      - name: Forget the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      # The point of the job: something a maintainer can install on a phone and look at, from a
      # build nobody ran by hand. Debug-signed, so it is for testing rather than distribution.
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload the minified verification APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-verification
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  runtime:
    name: API 36 release upgrade smoke
    needs: assemble
    # Fork PRs cannot access release signing. A debug-signed build cannot update v0.2.0.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Eight rounds revisit all four widget configurations, plus placement and geometry checks.
    # Individual UI/control deadlines remain bounded in the smoke script.
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Same-run artifacts bind this test to the exact SHA/version produced by `assemble`.
      - uses: actions/download-artifact@v4
        with:
          name: app-release-verification
          path: runtime/apk
      - uses: actions/download-artifact@v4
        with:
          name: apk-verification
          path: runtime/verification

      - name: Download the published upgrade baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p runtime/previous
          gh release download v0.2.0 --repo "$GITHUB_REPOSITORY" \
            --pattern 'UsageLimits-0.2.0.apk' --dir runtime/previous

      # setup-android adds SDK command-line tools (including sdkmanager) to PATH.
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Check the AOSP API 36 image is available
        run: |
          set -euo pipefail
          mkdir -p runtime/evidence
          sdkmanager --list > runtime/evidence/sdk-packages.txt
          if ! grep -Eq '^[[:space:]]*system-images;android-36;default;x86_64[[:space:]]*\|' runtime/evidence/sdk-packages.txt; then
            echo '::error::The SDK repository does not list the required AOSP API 36 x86_64 image.' >&2
            exit 1
          fi

      # KVM setup from https://github.com/ReactiveCircus/android-emulator-runner
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Upgrade and navigate the release APK
        run: xvfb-run --auto-servernum --server-args='-screen 0 1440x3120x24 -nolisten tcp' bash tools/run_android_runtime.sh --previous-apk runtime/previous/UsageLimits-0.2.0.apk --apk runtime/apk/app-release.apk --apk-sha256-file runtime/verification/apk-sha256.txt --evidence runtime/evidence

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-evidence-${{ github.sha }}
          path: runtime/evidence
          if-no-files-found: warn
