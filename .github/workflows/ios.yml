name: iOS

# Linux checks portable logic and framework shims; macOS checks Darwin code and the real iOS SDK.

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit-linux:
    name: UsageLimitsKit (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.0.3
    steps:
      - uses: actions/checkout@v4
      # Shims catch missing declarations; real Apple SDK validation runs on macOS.
      - name: The app and widget type-check against framework shims
        run: ./ios/Tools/typecheck-app.sh
      - name: Test
        working-directory: ios/UsageLimitsKit
        run: swift test --parallel

  kit-macos:
    name: UsageLimitsKit (macOS)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: ios/UsageLimitsKit
        run: swift test --parallel

  app-ios:
    name: iOS app (real SDK)
    needs: kit-linux
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && xcrun --sdk iphonesimulator --show-sdk-version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the project
        working-directory: ios/UsageLimits
        run: xcodegen generate
      # A generic destination avoids depending on a specific simulator model.
      - name: Build for simulator
        working-directory: ios/UsageLimits
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme UsageLimits \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGN_STYLE=Manual

      # Building the extension alone does not prove it is embedded in the app.
      - name: The widget is embedded in the app bundle
        working-directory: ios/UsageLimits
        run: |
          set -euo pipefail
          # Build settings contain every scheme target; select the app explicitly.
          settings=$(xcodebuild -showBuildSettings -json \
            -scheme UsageLimits \
            -destination 'generic/platform=iOS Simulator' 2>/dev/null | sed -n '/^\[/,$p')
          app=$(printf '%s' "$settings" | jq -r \
            'map(select(.target == "UsageLimits")) | last | .buildSettings
             | "\(.BUILT_PRODUCTS_DIR)/\(.FULL_PRODUCT_NAME)"')
          products=$(dirname "$app")
          echo "app bundle: $app"
          case "$app" in
            *.app) ;;
            *) echo "::error::resolved '$app', which is not an app bundle - the build-settings lookup picked the wrong target" >&2
               exit 1 ;;
          esac
          appex="$app/PlugIns/UsageLimitsWidget.appex"
          if [ ! -d "$appex" ]; then
            echo "::error::UsageLimitsWidget.appex is not embedded in the app bundle" >&2
            echo "-- contents of the app bundle:" >&2; ls -1 "$app" >&2 || true
            echo "-- .appex in the products dir:" >&2; ls -1d "$products"/*.appex >&2 || true
            exit 1
          fi
          point=$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$appex/Info.plist")
          echo "extension point: $point"
          [ "$point" = "com.apple.widgetkit-extension" ] || {
            echo "::error::wrong NSExtensionPointIdentifier: $point" >&2; exit 1; }

      # Discover an installed iPhone simulator; fail if none is available.
      - name: Pick and boot a simulator
        id: simulator
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.isAvailable and (.name | startswith("iPhone")))] | last | .udid')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "no available iPhone simulator on this runner" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b

      - name: Run the app on the simulator
        working-directory: ios/UsageLimits
        run: |
          set -o pipefail
          # Bound test duration and keep one simulator with a fixed result bundle path.
          xcodebuild test \
            -scheme UsageLimits \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath "$GITHUB_WORKSPACE/ios-tests.xcresult" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGN_STYLE=Manual

      # Run simulators sequentially to avoid launchd conflicts; retry once on a fresh iPad.
      - name: Run adaptive UI checks on an iPad
        working-directory: ios/UsageLimits
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.isAvailable and (.name | startswith("iPad")))] | last | .udid')
          test -n "$udid" && test "$udid" != "null"
          xcrun simctl shutdown all || true
          for attempt in 1 2; do
            if [ "$attempt" -eq 2 ]; then
              echo "::warning::first iPad attempt hit a simulator failure; retrying on a fresh device" >&2
              xcrun simctl shutdown all || true
              xcrun simctl delete "$udid" || true
              devicetype=$(xcrun simctl list devicetypes | grep 'iPad-Pro' | tail -1 | sed 's/.*(//' | sed 's/)//')
              udid=$(xcrun simctl create "iPad CI retry" "$devicetype")
            fi
            xcrun simctl erase "$udid" || true
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            if xcodebuild test \
              -scheme UsageLimits \
              -destination "platform=iOS Simulator,id=$udid" \
              -resultBundlePath "$GITHUB_WORKSPACE/ios-ipad-tests-$attempt.xcresult" \
              -parallel-testing-enabled NO \
              -test-timeouts-enabled YES \
              -maximum-test-execution-time-allowance 300 \
              -only-testing:UsageLimitsUITests/AppLaunchUITests/testEachScreenOpensWithNoAccountsConnected \
              -only-testing:UsageLimitsUITests/AppLaunchUITests/testLandscapeAndLargeTextKeepTheProviderPickerReachable \
              CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGN_STYLE=Manual; then
              exit 0
            fi
          done
          exit 1

      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-test-results
          path: |
            ios-tests.xcresult
            ios-ipad-tests-*.xcresult
          if-no-files-found: ignore
